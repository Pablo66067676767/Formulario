
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="form.css">
    <title>Cadastro de Usuário Externo</title>
</head>
<body>

    <header>
        <h1 style="text-align: center;">
            Cadastro de Usuário Externo
        </h1>
    </header>

    <main>

        <h2>Dados Cadastrais</h2>

        <form>

            <section>

                <div class="campo completo">
                    <label for="nome">Nome do Representante:</label>
                    <input type="text" id="nome" required>
                </div>

                <div class="campo">
                    <label for="cpf">CPF:</label>
                    <input type="text" id="cpf" required>
                </div>

                <div class="campo">
                    <label for="rg">RG:</label>
                    <input type="text" id="rg" required>
                </div>

                <div class="campo">
                    <label for="orgao">Órgão Expedidor:</label>
                    <input type="text" id="orgao">
                </div>

                <div class="campo">
                    <label for="telefone">Telefone Fixo:</label>
                    <input type="text" id="telefone">
                </div>

                <div class="campo">
                    <label for="celular">Telefone Celular:</label>
                    <input type="text" id="celular" required>
                </div>

                <div class="campo completo">
                    <label for="endereco">Endereço Residencial:</label>
                    <input type="text" id="endereco">
                </div>

                <div class="campo">
                    <label for="complemento">Complemento:</label>
                    <input type="text" id="complemento">
                </div>

                <div class="campo">
                    <label for="bairro">Bairro:</label>
                    <input type="text" id="bairro">
                </div>

                <div class="campo">
                    <label for="cidade">Cidade:</label>
                    <input type="text" id="cidade">
                </div>

                <div class="campo">
                    <label for="cep">CEP:</label>
                    <input type="text" id="cep">
                </div>

            </section>

            <h2>Dados de Autenticação</h2>

            <section>

                <div class="campo autenticacao">
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" required>
                </div>

                <div class="campo autenticacao">
                    <label for="senha">Senha (mínimo 8 caracteres):</label>
                    <input type="password" id="senha" minlength="8" required>
                </div>

                <div class="campo autenticacao">
                    <label for="confirmar">Confirmar Senha:</label>
                    <input type="password" id="confirmar" minlength="8" required>
                </div>

            </section>

            <div class="botoes">
                <button type="submit">Enviar</button>
                <button type="reset">Limpar</button>
            </div>

        </form>

    </main>

</body>
</html>
